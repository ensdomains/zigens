# ENSv2 Staging Indexer + GraphQL API
# Usage: docker compose -f docker-compose.staging.yml up -d

services:
  # V2 Indexer (Staging)
  indexer-v2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Release profile for the Zig build: ReleaseSafe (default; keeps
        # runtime safety checks) or ReleaseFast. Set ZIG_OPTIMIZE in the
        # deploy environment; keep both services' args identical so they
        # share one image build.
        - ZIG_OPTIMIZE=${ZIG_OPTIMIZE:-ReleaseSafe}
        # Staging only ever runs ensv2-indexer-v2 and ensv2-api, so skip
        # compiling the combined + V1 binaries (each is a separate whole-
        # program optimized compile — this roughly halves the image build).
        # Set ZIG_TARGETS=all to get the full binary set.
        - ZIG_TARGETS=${ZIG_TARGETS:-v2api}
    container_name: ensv2-indexer-v2-staging
    # Hard memory ceiling. Without one, a single service can consume the whole
    # host and take its neighbour down with it — an indexer growing unbounded is
    # what crash-looped the API previously. Docker kills the container on
    # breach and `restart: unless-stopped` brings it back, turning a host-wide
    # stall into one restarted service. Sized for a 4 GB host; raise both
    # values together via the environment on a larger box.
    deploy:
      resources:
        limits:
          memory: ${INDEXER_MEMORY_LIMIT:-2g}
    mem_swappiness: 0
    restart: unless-stopped
    command: ["/app/ensv2-indexer-v2"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ens-data-staging:/app/data
      - webhook-data-staging:/app/webhooks
    environment:
      - DATABASE_PATH=/app/data/ens_staging.db
      # Postgres (e.g. Neon): set DATABASE_URL to a postgres:// string to switch off
      # SQLite. Backend is inferred from the URL scheme; the image is built with
      # -Dpg-tls=true so a `?sslmode=require` Neon URL negotiates TLS.
      - DATABASE_BACKEND=${DATABASE_BACKEND:-}
      # The WRITER keeps a DIRECT (session-mode) connection. The unnamed-statement
      # hazard that forced this is gone (see the reader below — the driver names every
      # statement now), but the indexer's full workload has not been validated behind a
      # pooler, so this stays direct until it is. Multi-statement transactions are fine
      # either way — a transaction-mode pooler pins one backend for the transaction —
      # and session state is pooler-dependent: pgbouncer drops a connection-scoped SET,
      # PgDog virtualises it. INDEXER_DATABASE_URL overrides DATABASE_URL here.
      - DATABASE_URL=${INDEXER_DATABASE_URL:-${DATABASE_URL:-}}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-8}
      # Postgres only: bound per-statement runtime (seconds) so a stuck query fails
      # loudly instead of hanging forever; 0 disables. Raise for heavy bulk reindexes.
      - DATABASE_STATEMENT_TIMEOUT=${DATABASE_STATEMENT_TIMEOUT:-120}
      # Postgres only: trade per-commit WAL durability for bulk-sync speed. One of
      # on|off|local|remote_write|remote_apply; blank = server default (on). Safe for an
      # indexer — it re-syncs from the chain on restart.
      - DATABASE_SYNCHRONOUS_COMMIT=${DATABASE_SYNCHRONOUS_COMMIT:-}
      # Postgres only: reuse server-side prepared statements (big win on remote DBs);
      # set to 0 to disable if it ever misbehaves.
      - RAINBOW_PATH=/app/data/ens_rainbow.db
      - DOWNLOAD_RAINBOW=true
      - RPC_URL=${RPC_URL}
      - NETWORK=${NETWORK:-sepolia}
      - BATCH_SIZE=${BATCH_SIZE:-2000}
      - POLL_INTERVAL=12
      - RATE_LIMIT_PER_SECOND=25
      - STATUS_PORT=3002
      # Track the chain's safe/finalized heads each poll (Task 09). Feeds the
      # ensv2_finality_* metrics and the API's freshness signal; two extra RPC
      # calls per poll.
      - FINALITY_ENABLED=${FINALITY_ENABLED:-true}
      - WEBHOOKS_ENABLED=${WEBHOOKS_ENABLED:-false}
      - WEBHOOK_DB_PATH=/app/webhooks/webhooks.db
      - WEBHOOK_MAX_RETRIES=${WEBHOOK_MAX_RETRIES:-3}
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ens-network-staging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # GraphQL API Server (Staging)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ZIG_OPTIMIZE=${ZIG_OPTIMIZE:-ReleaseSafe}
        - ZIG_TARGETS=${ZIG_TARGETS:-v2api}
    container_name: ensv2-api-staging
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}
    mem_swappiness: 0
    restart: unless-stopped
    command: ["/app/api-entrypoint.sh"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "5656:5656"
    volumes:
      - ens-data-staging:/app/data:ro
      - webhook-data-staging:/app/webhooks
    environment:
      - DATABASE_PATH=/app/data/ens_staging.db
      # Postgres (e.g. Neon): set DATABASE_URL to a postgres:// string to switch off
      # SQLite. Backend is inferred from the URL scheme; the image is built with
      # -Dpg-tls=true so a `?sslmode=require` Neon URL negotiates TLS.
      - DATABASE_BACKEND=${DATABASE_BACKEND:-}
      # The READER may be POOLED on stock pooler settings. Every statement the driver
      # prepares is now named; it never uses the unnamed slot, whose Parse and Bind a
      # transaction-mode pooler could serve from different backends (SQLSTATE
      # 08P01/26000 — and silently WRONG ROWS when the two statements took the same
      # number of parameters). MEASURED with this service's binary, 320 concurrent
      # requests through PgDog 0.1.26 in transaction mode with no pooler tuning:
      # 176 failed before the change, 0 after. The requirement that remains is that the
      # pooler track NAMED prepared statements — PgDog does by default; pgbouncer needs
      # max_prepared_statements > 0 (its default is 0).
      # API_DATABASE_URL overrides DATABASE_URL for this service.
      - DATABASE_URL=${API_DATABASE_URL:-${DATABASE_URL:-}}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-8}
      # Postgres only: bound per-statement runtime (seconds) so a stuck query fails
      # loudly instead of hanging forever; 0 disables. Raise for heavy bulk reindexes.
      - DATABASE_STATEMENT_TIMEOUT=${DATABASE_STATEMENT_TIMEOUT:-120}
      # Postgres only: trade per-commit WAL durability for bulk-sync speed. One of
      # on|off|local|remote_write|remote_apply; blank = server default (on). Safe for an
      # indexer — it re-syncs from the chain on restart.
      - DATABASE_SYNCHRONOUS_COMMIT=${DATABASE_SYNCHRONOUS_COMMIT:-}
      # Postgres only: reuse server-side prepared statements (big win on remote DBs);
      # set to 0 to disable if it ever misbehaves.
      - RAINBOW_PATH=/app/data/ens_rainbow.db
      - DOWNLOAD_RAINBOW=false
      - API_PORT=5656
      # Inbound per-IP HTTP limiting for the API. This has to live on THIS service:
      # the indexer also reads RATE_LIMIT_PER_SECOND, but for its own OUTBOUND RPC
      # throttle, so setting it only there left the API on the code default (15/s)
      # and capped the public surface without anyone choosing that number.
      - RATE_LIMIT_PER_SECOND=${API_RATE_LIMIT_PER_SECOND:-25}
      # Without finality data, report stale=true once a protocol has gone this long
      # without committing a batch (see .env.example). Above the longest healthy
      # batch; set 0 for a --backfill or an END_BLOCK-pinned deployment.
      - COVERAGE_STALE_AFTER_SECONDS=${COVERAGE_STALE_AFTER_SECONDS:-3600}
      - GRAPHQL_MAX_DEPTH=10
      - GRAPHQL_MAX_COST=${GRAPHQL_MAX_COST:-10000}
      # Live resolution (ENSIP-10 Universal Resolver fallback) for single-name
      # queries; needs an RPC the API can call — RESOLVE_RPC_URL falls back to
      # the indexer's RPC_URL value from the environment.
      - RESOLVE_LIVE_ENABLED=${RESOLVE_LIVE_ENABLED:-true}
      - RESOLVE_RPC_URL=${RESOLVE_RPC_URL:-${RPC_URL}}
      # ENSIP-3 forward verification of primary names (claimed vs verified);
      # exposes Account.primaryNameVerification and the verify-primary endpoint.
      - PRIMARY_VERIFY_ENABLED=${PRIMARY_VERIFY_ENABLED:-true}
      # CCIP-Read offchain lookups ride on live resolution; startup fails fast
      # if enabled without RESOLVE_LIVE_ENABLED.
      - RESOLVE_CCIP_ENABLED=${RESOLVE_CCIP_ENABLED:-false}
      # Behind Traefik: trust one proxy hop so rate limiting keys on the real
      # client IP instead of the proxy's.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      - WEBHOOKS_ENABLED=${WEBHOOKS_ENABLED:-false}
      - WEBHOOK_DB_PATH=/app/webhooks/webhooks.db
      - WEBHOOK_ADMIN_USERNAME=${WEBHOOK_ADMIN_USERNAME:-}
      - WEBHOOK_ADMIN_PASSWORD=${WEBHOOK_ADMIN_PASSWORD:-}
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
    depends_on:
      - indexer-v2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5656/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ens-network-staging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ens-network-staging:
    driver: bridge

volumes:
  ens-data-staging:
    driver: local
  webhook-data-staging:
    driver: local
