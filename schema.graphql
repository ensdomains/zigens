# ENSv2 Indexer GraphQL Schema
# This schema defines the GraphQL API for querying ENS V2 data

type Query {
  """
  Get a single domain by name or namehash. Exact get: returns the row even if
  non-normalized (unlike domains/where.name, which default-hide non-normalized
  names); unreachable rows are still hidden (returns null). `atBlock` (ensv2
  extension) reconstructs the domain's state as of that block from the event
  log — V2 names only; scalar fields, `resolver { addr text(key:) contentHash }`
  and `resolvedAddress` are historical; list record fields return empty at-block;
  nested domain entities (parent/subdomains) reflect current state; an
  out-of-range block or a name without V2 event history resolves to null.
  """
  domain(id: String!, atBlock: Int): Domain

  """Get multiple domains with pagination and filtering (legacy offset-based)"""
  domains(first: Int = 100, skip: Int = 0, where: DomainFilter, orderBy: Domain_orderBy, orderDirection: OrderDirection): [Domain!]!

  """Get multiple domains with cursor-based pagination (recommended)"""
  domainConnection(first: Int, after: String, last: Int, before: String, where: DomainFilter, orderBy: Domain_orderBy, orderDirection: OrderDirection): DomainConnection!

  """Get account information by address"""
  account(id: String!): Account

  """List Account entities with pagination and filtering (subgraph parity)."""
  accounts(first: Int = 100, skip: Int = 0, where: AccountFilter, orderBy: Account_orderBy, orderDirection: OrderDirection): [Account!]!

  """Get domain registrations with pagination (legacy offset-based)"""
  registrations(first: Int = 100, skip: Int = 0, where: RegistrationFilter, orderBy: Registration_orderBy, orderDirection: OrderDirection): [Registration!]!

  """Get domain registrations with cursor-based pagination (recommended)"""
  registrationConnection(first: Int, after: String, last: Int, before: String, where: RegistrationFilter, orderBy: Registration_orderBy, orderDirection: OrderDirection): RegistrationConnection!

  """Get events with pagination (legacy offset-based)"""
  events(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Get events with cursor-based pagination (recommended)"""
  eventConnection(first: Int, after: String, last: Int, before: String, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): EventConnection!

  """Subgraph parity: top-level `Transfer` events. Equivalent to `events(where:{type:"Transfer"})`. Inspect typed fields via `asTransfer { ... }`."""
  transfers(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `NameRegistered` events. Inspect via `asNameRegistered { ... }`."""
  nameRegistereds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `NameRenewed` events. Inspect via `asNameRenewed { ... }`."""
  nameReneweds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `TextChanged` events. Inspect via `asTextChanged { ... }`."""
  textChangeds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `AddressChanged` events. Inspect via `asAddressChanged { ... }`."""
  addressChangeds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `NameWrapped` events. Inspect via `asNameWrapped { ... }`."""
  nameWrappeds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `NameUnwrapped` events. Inspect via `asNameUnwrapped { ... }`."""
  nameUnwrappeds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `FusesSet` events. Inspect via `asFusesSet { ... }`."""
  fusesSets(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `ExpiryUpdated` events. Inspect via `asExpiryUpdated { ... }`."""
  expiryUpdateds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `ResolverUpdated` events. Inspect via `asResolverUpdated { ... }`."""
  resolverUpdateds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `LabelRegistered` events. Inspect via `asLabelRegistered { ... }`."""
  labelRegistereds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `ReverseClaimed` events. Inspect via `asReverseClaimed { ... }`."""
  reverseClaimeds(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Subgraph parity: top-level `RegistryTransfer` events. Inspect via `asRegistryTransfer { ... }`."""
  registryTransfers(first: Int = 100, skip: Int = 0, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Get EAC role assignments"""
  roles(resource: String, account: String): [EACRoleAssignment!]!

  """Get EAC role assignments with cursor-based pagination (recommended)"""
  roleConnection(first: Int, after: String, last: Int, before: String, resource: String, account: String): EACRoleAssignmentConnection!

  """
  List resolver contracts owned by a specific account (admin view).
  Hard-renamed from the previous `resolvers(account:)` in Phase 4a of the
  parity migration so the bare `resolvers` field name is reserved for the
  subgraph-style entity listing.
  """
  resolversByOwner(account: String!, protocol: String): [ResolverDetail!]!

  """
  List Resolver entities (subgraph parity). One entity per (protocol, address,
  namehash) binding. Entity `id` is rendered `{protocol}-{address}-{namehash}`
  (using `v1`/`v2` as the isolation prefix since both protocols share the chain).
  """
  resolvers(first: Int = 100, skip: Int = 0, where: ResolverFilter, orderBy: Resolver_orderBy, orderDirection: OrderDirection): [Resolver!]!

  """Get registries owned by an account"""
  registries(owner: String!): [RegistryInfo!]!

  """Look up a single registry contract by its address (Registry view entry point)."""
  registry(address: String!): RegistryInfo

  """Get ENSIP-16 resolver metadata (offchain GraphQL endpoint)"""
  metadata(resolver: String!): ResolverMetadata

  """Get ENSIP-16 resolver approvals/delegations"""
  approvals(namehash: String, delegate: String): [ResolverApproval!]!

  """Get resolver information by contract address"""
  resolver(id: String!): ResolverDetail

  """Get V1 NameWrapper wrapped-domain records. Returns empty for V2 / unwrapped names. (Subgraph parity.)"""
  wrappedDomains(first: Int = 100, skip: Int = 0, where: WrappedDomainFilter): [WrappedDomain!]!

  """Indexer health / sync state (subgraph parity)."""
  _meta: _Meta_!

  """
  Finality signalling (ensv2 extension, NOT subgraph). Per-chain head / safe /
  finalized block positions so a consumer can judge how settled an answer is.
  `safe`/`finalized` are null until FINALITY_ENABLED and the indexer has fetched them.
  """
  _finality: Finality!

  """
  What this deployment indexes (ensv2 extension): chain id, per-protocol indexed
  head + last-sync time, and a staleness flag. `stale` is false when finality data
  is absent (default deployments); `_finality.isStale` is the conservative variant.
  """
  _coverage: Coverage!
}

"""Deployment coverage declaration (ensv2 extension)."""
type Coverage {
  """EVM chain id this deployment indexes."""
  chainId: Int!
  """True only when finality data shows the indexed head behind the chain's safe point."""
  stale: Boolean!
  """Per-protocol indexed positions."""
  protocols: [ProtocolCoverage!]!
}

"""One protocol's indexed position within `Coverage`."""
type ProtocolCoverage {
  """Protocol name: "v1" or "v2"."""
  protocol: String!
  """Highest block synced for this protocol (0 = never synced)."""
  indexedHead: Int!
  """When the head last advanced (unix seconds), or null when never synced."""
  lastSyncedAt: Int
}

"""Finality positions + a staleness signal (ensv2 extension)."""
type Finality {
  """Indexed head (highest block synced); hash is null across the two protocols."""
  head: FinalityBlock!
  """Chain `safe` block position, or null when not fetched."""
  safe: FinalityBlock
  """Chain `finalized` block position, or null when not fetched."""
  finalized: FinalityBlock
  """True when the indexed head has not reached the chain's safe point (or no safe data)."""
  isStale: Boolean!
}

"""A block position within `Finality`."""
type FinalityBlock {
  number: Int!
  """Block hash (hex), or null."""
  hash: String
  """When this position was fetched (unix seconds), or null."""
  updatedAt: Int
}

"""Indexer health / sync state (subgraph parity)."""
type _Meta_ {
  """Current head block (highest block synced)."""
  block: _Block_!
  """Whether the indexer has hit an indexing error and stalled."""
  hasIndexingErrors: Boolean!
  """Deployment id / version string."""
  deployment: String
}

"""Block descriptor returned inside `_Meta_`."""
type _Block_ {
  """Block number."""
  number: Int!
  """Block hash (hex), or null when unknown."""
  hash: String
  """Block timestamp (seconds), or null when unknown."""
  timestamp: Int
}

"""V1 NameWrapper wrapped-domain record. Returns null for unwrapped or V2 domains."""
type WrappedDomain {
  """Same as the wrapped Domain's namehash."""
  id: String!
  """The wrapped Domain itself."""
  domain: Domain!
  """Wrapper expiry timestamp."""
  expiryDate: Int
  """Fuse bitmap (CANNOT_UNWRAP, PARENT_CANNOT_CONTROL, etc.)."""
  fuses: Int
  """Wrapped-token owner (EOA)."""
  owner: Account
  """Name string."""
  name: String
}

"""Filter criteria for querying wrapped domains."""
input WrappedDomainFilter {
  """Filter by wrapped-domain owner address."""
  owner: String
  """Filter by domain name (exact)."""
  name: String
  """Filter by expiry date greater than (Unix timestamp)."""
  expiryDate_gt: Int
  """Filter by expiry date less than (Unix timestamp)."""
  expiryDate_lt: Int
}

# ============================================================================
# Cursor-Based Pagination Types (Relay Specification)
# ============================================================================

"""
Information about pagination in a connection
Follows the Relay Cursor Connections Specification
"""
type PageInfo {
  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!

  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!

  """When paginating backwards, the cursor to continue"""
  startCursor: String

  """When paginating forwards, the cursor to continue"""
  endCursor: String
}

"""An edge in a Domain connection"""
type DomainEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: Domain!
}

"""A connection to a list of Domains"""
type DomainConnection {
  """Information to aid in pagination"""
  pageInfo: PageInfo!

  """A list of edges"""
  edges: [DomainEdge!]!

  """Total count of items (may be expensive to compute)"""
  totalCount: Int
}

"""An edge in a Registration connection"""
type RegistrationEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: Registration!
}

"""A connection to a list of Registrations"""
type RegistrationConnection {
  """Information to aid in pagination"""
  pageInfo: PageInfo!

  """A list of edges"""
  edges: [RegistrationEdge!]!

  """Total count of items (may be expensive to compute)"""
  totalCount: Int
}

"""An edge in an Event connection"""
type EventEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: Event!
}

"""A connection to a list of Events"""
type EventConnection {
  """Information to aid in pagination"""
  pageInfo: PageInfo!

  """A list of edges"""
  edges: [EventEdge!]!

  """Total count of items (may be expensive to compute)"""
  totalCount: Int
}

"""An edge in an EACRoleAssignment connection"""
type EACRoleAssignmentEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: EACRoleAssignment!
}

"""A connection to a list of EACRoleAssignments"""
type EACRoleAssignmentConnection {
  """Information to aid in pagination"""
  pageInfo: PageInfo!

  """A list of edges"""
  edges: [EACRoleAssignmentEdge!]!

  """Total count of items (may be expensive to compute)"""
  totalCount: Int
}

"""An ENS domain name"""
type Domain {
  """Domain namehash (ERC-137 node hash), matching the ENS subgraph. The singular `domain(id:)` lookup still accepts a name or a namehash."""
  id: String!

  """Full domain name (e.g., 'vitalik.eth')"""
  name: String

  """Label only (e.g., 'vitalik' for 'vitalik.eth')"""
  labelName: String

  """Keccak256 hash of the label. Non-null: this indexer only materializes a Domain once its label is known (it never creates tokenId-only rows like the subgraph/ENSNode), so clients need no null guard."""
  labelhash: String!

  """Parent domain"""
  parent: Domain

  """Subdomains of this domain"""
  subdomains: [Domain!]!

  """Address this domain resolves to"""
  resolvedAddress: Account

  """Current owner of the domain"""
  owner: Account!

  """Resolver contract for this domain"""
  resolver: Resolver

  """The registry contract that manages this domain's subnames — the value of the parent registry's `getSubregistry(label)` pointer, set from `SubregistryUpdated`. Null when no subregistry is set (or for V1 names). This is the registry whose `referencedBy` includes this domain."""
  subregistry: RegistryInfo

  """ENS V1 Registry TTL (from `NewTTL` event). Null when never set or for V2 domains."""
  ttl: Int

  """V1-only provenance: true when the row's most recent update came from the legacy pre-2020 ENS Registry (0x314159…); false when it's been touched by the canonical post-2020 Registry (0x00…2e1e) or for V2 names."""
  isLegacy: Boolean!

  """Whether this domain has been migrated to V2"""
  isMigrated: Boolean!

  """Whether this name is currently wrapped in V1 NameWrapper. When true, the `owner` field returns the wrapped-token owner (EOA), NOT the NameWrapper contract address — this is a deliberate divergence from the ENS subgraph for client convenience. Subgraph clients that need the NameWrapper-as-owner shape should query the on-chain `ownerOf()` directly."""
  isWrapped: Boolean!

  """Fuse bitmap from V1 NameWrapper (CANNOT_UNWRAP, PARENT_CANNOT_CONTROL, etc.). Null when not wrapped."""
  fuses: Int

  """Wrapper expiry timestamp from V1 NameWrapper. Null when not wrapped."""
  wrapperExpiry: Int

  """Grace-period end for V1 .eth 2LDs (expiry + 90 days). Now an explicit-name alias for `Domain.expiryDate` (which itself includes the grace period for V1 .eth 2LDs per subgraph parity). Null for non-V1 names, non-.eth 2LDs, or names without expiry."""
  gracePeriodEnd: Int

  """ENS protocol version this domain belongs to ("v1" = legacy ENS, "v2" = ENSv2)."""
  protocol: String!

  """
  Whether this domain is reachable via canonical top-down resolution.
  False when an ancestor label's subregistry pointer has moved away from
  the subregistry contract that originally minted this domain (orphaned
  subtree), when the domain has been LabelUnregistered, or when an
  ancestor expiry has passed. Default GraphQL queries filter
  `isReachable: true` — pass `where: { includeUnreachable: true }` to
  include orphans.
  """
  isReachable: Boolean!

  """Timestamp when this domain first became unreachable (null while reachable)"""
  unreachableSince: Int

  """Timestamp when domain was created"""
  createdAt: Int!

  """Timestamp when domain was registered"""
  registrationDate: Int

  """Original registrant of the domain"""
  registrant: Account

  """Timestamp when domain expires. For V1 .eth 2LDs, includes the 90-day grace period (`BaseRegistrar.expires + 90d`) to match subgraph semantics. The bare on-chain `expires` is still available via the parallel `Registration.expiryDate`."""
  expiryDate: Int

  """ERC-721 token ID for this domain"""
  tokenId: String

  """Canonical token ID (without version bits)"""
  canonicalId: String

  """Token version number"""
  tokenVersion: Int

  """ENSIP-15 normalized name (null if normalization fails)"""
  normalizedName: String

  """Whether the name passes ENSIP-15 normalization (computed at query time)"""
  isNormalized: Boolean!

  """Finality tier of this domain's CURRENT state — how settled it is against chain finality. FINALIZED = the last change is at/below the finalized head (will not reorg); SAFE = at/below the safe head; HEAD = in the unsafe zone (may still reorg). Null when finality tracking is disabled (FINALITY_ENABLED off), so a client can distinguish 'unknown' from 'unsafe'."""
  finality: DomainFinality

  """Events associated with this domain"""
  events(first: Int = 100, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!

  """Count of direct subdomains (one level only). Filtered by `isReachable = 1` AND excluding fully-burned names (owner=0 AND resolver=0, mirroring subgraph's GC deletion criteria). DEPRECATED: prefer `subdomainCount` (subgraph-compatible name)."""
  subdomainsCount: Int!

  """Subgraph-compatible alias for `subdomainsCount`. Returns the same value."""
  subdomainCount: Int!

  """Count of events associated with this domain"""
  eventsCount: Int!

  """
  Number of distinct accounts holding any label-scoped role on this label,
  matched by the label's canonical (version-independent) token id and its
  registry. Excludes the registry-wide root/admin role and empty role bitmaps,
  so it reflects only roles tied to this individual label.
  """
  roleHolderCount: Int!

  """V1 NameWrapper wrapped-domain record. Null for V2 or unwrapped domains."""
  wrappedDomain: WrappedDomain

  """Wrapped owner (V1 NameWrapper EOA). Null when not wrapped."""
  wrappedOwner: Account
}

"""An Ethereum account (address)"""
type Account {
  """Ethereum address"""
  id: String!

  """Domains owned by this account"""
  domains: [Domain!]!

  """Registrations made by this account"""
  registrations(first: Int = 100, skip: Int = 0): [Registration!]!

  """Reverse-resolved primary name for this address (V1 ReverseRegistrar + NameChanged path). Null if not claimed."""
  primaryName: String

  """ENSIP-3 forward verification of `primaryName` (Task 05). Additive — does NOT alter `primaryName`. VERIFIED = the name's forward resolution (via the Universal Resolver when configured) points back to this address; MISMATCH = it resolves to a different address; INVALID_NAME = the claimed name is not ENSIP-15 normalized; NOT_FOUND = no resolver/record; UNVERIFIED = the on-chain read reverted / errored / not checked. Null unless PRIMARY_VERIFY_ENABLED, and computed only for single-entity lookups (never per-row in a list)."""
  primaryNameVerification: PrimaryNameVerification

  """V1 NameWrapper wrapped-domain records owned by this account."""
  wrappedDomains(first: Int = 100, skip: Int = 0): [WrappedDomain!]!

  """True if this address has ever been observed acting under the V1 protocol (owner, registrant, role grantee, transfer recipient, or operator)."""
  seenV1: Boolean!

  """True if this address has ever been observed acting under the V2 protocol."""
  seenV2: Boolean!

  """Block number of the earliest observation across protocols. Zero if the account row was populated by backfill (no first-observation block was recorded)."""
  firstSeenBlock: Int!

  """Unix timestamp (seconds) of the earliest observation across protocols. Zero if unknown."""
  firstSeenTimestamp: Int!
}

"""
Filter input for the `accounts` query (subgraph parity). All fields are optional;
fields combine with AND semantics. `id`/`id_in` match exact addresses; `seenV1`/`seenV2`
filter by the per-protocol observation flag.
"""
input AccountFilter {
  """Exact address match."""
  id: String

  """Address in list (up to 1000)."""
  id_in: [String!]

  """Restrict to addresses observed under V1 (true) or never observed under V1 (false)."""
  seenV1: Boolean

  """Restrict to addresses observed under V2 (true) or never observed under V2 (false)."""
  seenV2: Boolean
}

"""Sort key for the `accounts` query."""
enum Account_orderBy {
  """Lexicographic order on the 0x-prefixed address."""
  id

  """First-observation block (the earlier of V1/V2 observations)."""
  firstSeenBlock
}

"""
Filter input for the `resolvers` (entity-list) query (subgraph parity).
Fields combine with AND semantics. Use `address`/`address_in` to scope by
resolver contract, `namehash` to scope by name, and `protocol` (`"v1"` or
`"v2"`) for protocol isolation.
"""
input ResolverFilter {
  """Exact match on resolver contract address (0x-hex, lowercase)."""
  address: String

  """Resolver contract address in list (up to 1000)."""
  address_in: [String!]

  """Exact match on the bound name's namehash."""
  namehash: String

  """Restrict to a single protocol — `"v1"` or `"v2"`."""
  protocol: String
}

"""Sort key for the `resolvers` (entity-list) query."""
enum Resolver_orderBy {
  """Lexicographic order on the resolver contract address."""
  address

  """First-binding block (when this resolver was first bound to this name)."""
  setBlock
}

"""A coin address record with coin type (SLIP-44)"""
type CoinAddress {
  """SLIP-44 coin type (e.g., 60 for ETH, 0 for BTC, 501 for SOL). DEPRECATED: prefer `coinTypeBig` — ENSIP-11 L2 coin types (0x80000000 | chainId) exceed Int32 and will overflow. Kept for back-compat."""
  coinType: Int!

  """Decimal-string coin type. Use this instead of `coinType` to safely represent ENSIP-11 L2 coin types that exceed Int32."""
  coinTypeBig: String!

  """Address value for this coin type"""
  address: String!
}

"""A public key record (secp256k1 coordinates)"""
type Pubkey {
  """X coordinate (hex string)"""
  x: String!

  """Y coordinate (hex string)"""
  y: String!
}

"""An interface implementation record"""
type InterfaceRecord {
  """Interface ID (EIP-165 selector, hex string)"""
  interfaceId: String!

  """Implementer contract address"""
  implementer: String!
}

"""A resolver alias mapping (from OwnedResolver)"""
type Alias {
  """Source DNS name"""
  fromName: String!

  """Destination DNS name"""
  toName: String!
}

"""A resolver contract for an ENS domain"""
type Resolver {
  """Resolver contract address"""
  id: String!

  """Resolver contract address (same as id)"""
  address: String!

  """Address record for a specific coin type (default: 60 for ETH)"""
  addr(coinType: Int = 60): String

  """All set addresses across all coin types"""
  addresses: [CoinAddress!]

  """All coin types currently set on this resolver/name as decimal strings (ENSIP-11-safe). Parallel projection of `addresses.coinTypeBig`."""
  coinTypes: [String!]

  """Canonical Domain associated with this resolver (first by namehash). Null when this resolver isn't bound to any name. Subgraph parity."""
  domain: Domain

  """Content hash (IPFS, Arweave, etc.)"""
  contentHash: String

  """
  All text-record keys set on this resolver/name. This is a list of scalar
  strings (the keys only), NOT a list of {key, value} entities — the ENS
  subgraph's `texts` field has the same name but a different shape, so a
  subgraph-style `texts { key value }` selection will fail. To read values,
  call `text(key: "...")` per key.
  """
  texts: [String!]

  """Get a specific text record value by key (returns null if unset)."""
  text(key: String!): String

  """Public key record (secp256k1 x/y coordinates)"""
  pubkey: Pubkey

  """
  ABI content types set on this resolver. List of scalar integers (the
  contentType bitmasks only), not a list of entities — `abis { ... }` with
  a subselection will fail.
  """
  abis: [Int!]

  """Reverse name record (from NameChanged events)"""
  reverseName: String

  """Interface implementations set on this resolver"""
  interfaces: [InterfaceRecord!]

  """Aliases set on this resolver (from AliasChanged events)"""
  aliases: [Alias!]

  """Current version counter (from VersionChanged events)"""
  version: Int
}

"""A domain registration record"""
type Registration {
  """Registration identifier"""
  id: String!

  """Name of the registered domain"""
  name: String!

  """The domain that was registered"""
  domain: Domain!

  """Timestamp when domain was registered"""
  registrationDate: Int!

  """Timestamp when domain expires"""
  expiryDate: Int!

  """Account that registered the domain"""
  registrant: Account!

  """Chain where registration occurred (v1 or v2)"""
  protocol: String!

  """Total user-paid registration cost (base + premium) in wei, decimal-encoded. Returned as String because u256 wei values exceed GraphQL Int (Int32). Null when the Controller event has not been observed for this registration."""
  cost: String

  """Base rent cost in wei, decimal-encoded u256 (String for the same Int32 reason as `cost`). Null when the Controller event has not been observed."""
  baseCost: String

  """Auction premium portion in wei, decimal-encoded u256 (String, see `cost`). \"0\" for legacy 5-arg LegacyEthRegistrarController (no auction-premium semantics) or null when the Controller event has not been observed."""
  premium: String

  """Human-readable label from the Controller event preimage (e.g., 'vitalik'). Null when the Controller event has not been observed or the label preimage was lost."""
  labelName: String

  """Referrer bytes32 hex from the 7-arg UnwrappedEthRegistrarController (V1) or V2 ETHRegistrar.NameRegistered. Null for older Controller variants or when no Controller event has been observed."""
  referrer: String
}

"""Typed payload for `Transfer` events. Spans V1 BaseRegistrar ERC721 (`tokenId` numeric), V1 NameWrapper ERC1155 (`id` is the wrapped namehash, with `operator`/`value`), V2 registry transfers, ERC1155 `TransferBatch` summaries (`count`), and V1 Registry `NewOwner` rows (`parentNode`/`labelhash`/`subdomain`/`owner`)."""
type TransferData {
  """Sender address."""
  from: String
  """Recipient address."""
  to: String
  """Token id: ERC721 tokenId as a decimal string, or wrapper/V2 token id (namehash for NameWrapper). Stringified to preserve u256 range."""
  id: String
  """ERC1155 transfer amount (always 1 for ENS NameWrapper)."""
  value: String
  """ERC1155 operator address (V1 NameWrapper / V2 only)."""
  operator: String
  """ERC1155 TransferBatch: number of tokens in the batch (per-token id/value are not stored)."""
  count: Int
  """V1 Registry NewOwner rows: parent node namehash."""
  parentNode: String
  """V1 Registry NewOwner rows: labelhash of the subdomain label."""
  labelhash: String
  """V1 Registry NewOwner rows: namehash of the created/reassigned subdomain node."""
  subdomain: String
  """V1 Registry NewOwner rows: new owner address."""
  owner: String
}

