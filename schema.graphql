"""An event emitted by ENS contracts"""
type Event {
  """Event identifier"""
  id: String!

  """Type of event"""
  type: String!

  """Block number where event occurred"""
  blockNumber: Int!

  """Transaction hash"""
  transactionHash: String!

  """Timestamp when event occurred"""
  timestamp: Int!

  """Contract address that emitted the event"""
  contractAddress: String!

  """Name affected by this event"""
  name: String

  """Namehash of the name"""
  namehash: String

  """Domain associated with this event (if applicable)"""
  domain: Domain

  """Chain where event occurred (v1 or v2)"""
  protocol: String!

  """Event-specific data as JSON (e.g., key/value for TextChanged, address for AddressChanged)"""
  data: String

  """Text record key, populated when `type == "TextChanged"` (subgraph parity). Null for other event types."""
  key: String

  """Text record value, populated when `type == "TextChanged"` (subgraph parity). Null for other event types."""
  value: String

  """Typed view of `data` when `type` is `Transfer`. Null otherwise."""
  asTransfer: TransferData
  """Typed view of `data` when `type` is `NameRegistered`. Null otherwise."""
  asNameRegistered: NameRegisteredData
  """Typed view of `data` when `type` is `NameRenewed`. Null otherwise."""
  asNameRenewed: NameRenewedData
  """Typed view of `data` when `type` is `NameWrapped`. Null otherwise."""
  asNameWrapped: NameWrappedData
  """Typed view of `data` when `type` is `NameUnwrapped`. Null otherwise."""
  asNameUnwrapped: NameUnwrappedData
  """Typed view of `data` when `type` is `FusesSet`. Null otherwise."""
  asFusesSet: FusesSetData
  """Typed view of `data` when `type` is `ReverseClaimed`. Null otherwise."""
  asReverseClaimed: ReverseClaimedData
  """Typed view of `data` when `type` is `RegistryTransfer` (V1 ENS Registry setOwner). Null otherwise."""
  asRegistryTransfer: RegistryTransferData
  """Typed view of `data` when `type` is `TextChanged`. Null otherwise."""
  asTextChanged: TextChangedData
  """Typed view of `data` when `type` is `AddressChanged`. Null otherwise."""
  asAddressChanged: AddressChangedData
  """Typed view of `data` when `type` is `ExpiryUpdated`. Null otherwise."""
  asExpiryUpdated: ExpiryUpdatedData
  """Typed view of `data` when `type` is `ResolverUpdated`. Null otherwise."""
  asResolverUpdated: ResolverUpdatedData
  """Typed view of `data` when `type` is `LabelRegistered`. Null otherwise."""
  asLabelRegistered: LabelRegisteredData
}

"""Filter criteria for querying domains"""
input DomainFilter {
  """Exact match on the current versioned ERC-1155 token id (ensv2 extension) — the labelhash with its low 32 bits replaced by the token's version counter, exactly what NFT platforms send. Accepts 0x-hex or decimal. Hashing is one-way, so this is the tokenId-to-name reverse path; combine with `registry` to scope to one registry contract."""
  tokenId: String

  """Exact match on the version-masked canonical id (ensv2 extension; low 32 bits zeroed) — stable across token version bumps, for callers holding a possibly-stale token id. Accepts 0x-hex or decimal."""
  canonicalId: String

  """Registry contract address filter (ensv2 extension) — the V2 registry that owns this name's label. Combine with tokenId/canonicalId to scope a marketplace tokenId lookup to one registry."""
  registry: String

  """Exact name match (list filter). Unlike domain(id:), the domains/domainConnection list default-hides non-normalized, unreachable, and synthetic-root rows unless includeUnnormalized / includeUnreachable / isNormalized override."""
  name: String

  """Filter by name in list (up to 1000 names)"""
  name_in: [String!]

  """Negated exact-name match (subgraph parity)."""
  name_not: String

  """Negated name-in-list (subgraph parity, up to 1000 names)."""
  name_not_in: [String!]

  """Partial name match (contains)"""
  name_contains: String

  """Case-insensitive partial name match"""
  name_contains_nocase: String

  """Negated partial name match (subgraph parity)."""
  name_not_contains: String

  """Name starts with prefix"""
  name_starts_with: String

  """Case-insensitive prefix match (subgraph parity)."""
  name_starts_with_nocase: String

  """Name ends with suffix"""
  name_ends_with: String

  """Case-insensitive suffix match (subgraph parity)."""
  name_ends_with_nocase: String

  """Exact match on leftmost label (subgraph parity)."""
  labelName: String

  """Negated exact-label match."""
  labelName_not: String

  """Label in list (up to 1000 labels)."""
  labelName_in: [String!]

  """Negated label-in-list (up to 1000 labels)."""
  labelName_not_in: [String!]

  """Partial label match (contains)."""
  labelName_contains: String

  """Case-insensitive partial label match."""
  labelName_contains_nocase: String

  """Negated partial label match."""
  labelName_not_contains: String

  """Label starts with prefix."""
  labelName_starts_with: String

  """Case-insensitive label-prefix match."""
  labelName_starts_with_nocase: String

  """Label ends with suffix."""
  labelName_ends_with: String

  """Case-insensitive label-suffix match."""
  labelName_ends_with_nocase: String

  """Filter by owner address"""
  owner: String

  """Negated owner address match (subgraph parity)."""
  owner_not: String

  """Filter by owner address in list"""
  owner_in: [String!]

  """Negated owner-in-list (subgraph parity)."""
  owner_not_in: [String!]

  """Nested-relation filter on owner Account (subgraph parity). E.g. `{owner_: {id_in: [...]}}`."""
  owner_: AccountFilter

  """Filter by resolved address"""
  resolvedAddress: String

  """Filter by resolver contract address"""
  resolver: String

  """Filter by whether domain has direct subdomains (one level only)"""
  hasSubdomains: Boolean

  """Filter by direct subdomain count greater than (one level only)"""
  subdomainCount_gt: Int

  """Filter by direct subdomain count less than (one level only)"""
  subdomainCount_lt: Int

  """Filter by expiry date greater than (Unix timestamp)"""
  expiry_gt: Int

  """Filter by expiry date greater than or equal (Unix timestamp)"""
  expiry_gte: Int

  """Filter by expiry date less than (Unix timestamp)"""
  expiry_lt: Int

  """Filter by expiry date less than or equal (Unix timestamp)"""
  expiry_lte: Int

  """Subgraph-compatible alias for `expiry_gt`."""
  expiryDate_gt: Int

  """Subgraph-compatible alias for `expiry_gte`."""
  expiryDate_gte: Int

  """Subgraph-compatible alias for `expiry_lt`."""
  expiryDate_lt: Int

  """Subgraph-compatible alias for `expiry_lte`."""
  expiryDate_lte: Int

  """Filter by migration status"""
  isMigrated: Boolean

  """
  Include domains that are unreachable via canonical resolution
  (orphaned by subregistry repoints, label unregistration, or expired
  ancestors). Default false — set true for audit / debug queries.
  """
  includeUnreachable: Boolean

  """
  Filter by ENSIP-15 normalization status. When omitted, only normalized
  names are returned (non-normalized names like `Nick.eth` are hidden by
  default); set explicitly to `true`/`false` to filter, or pass
  `includeUnnormalized: true` to include both.
  """
  isNormalized: Boolean

  """
  Include non-normalized domains (e.g. `Nick.eth`, `VITALIK`) that are
  hidden by default. Default false. Ignored when `isNormalized` is set.
  """
  includeUnnormalized: Boolean

  """
  Boolean AND: every sub-filter must match. Each element is a full DomainFilter,
  nested recursively (subgraph parity). Combined with the other fields by AND.
  """
  and: [DomainFilter!]

  """
  Boolean OR: any sub-filter matches. Each element is a full DomainFilter, nested
  recursively (subgraph parity). The OR group is AND-combined with sibling fields,
  so `{ owner: X, or: [{...A}, {...B}] }` means `owner=X AND (A OR B)`. Default
  visibility (reachable/normalized/non-root) is applied once to the whole result.
  """
  or: [DomainFilter!]
}

"""Filter criteria for querying registrations"""
input RegistrationFilter {
  """Filter by registrant address"""
  registrant: String

  """Filter by registrant address in list"""
  registrant_in: [String!]

  """Filter by expiry date greater than"""
  expiryDate_gt: Int

  """Filter by expiry date greater than or equal"""
  expiryDate_gte: Int

  """Filter by expiry date less than"""
  expiryDate_lt: Int

  """Filter by expiry date less than or equal"""
  expiryDate_lte: Int

  """Filter by protocol (v1 or v2)"""
  protocol: String

  """Boolean AND: every sub-filter must match. Each element is a full RegistrationFilter, nested recursively (subgraph parity)."""
  and: [RegistrationFilter!]

  """Boolean OR: any sub-filter matches. Each element is a full RegistrationFilter, nested recursively; the OR group is AND-combined with sibling fields."""
  or: [RegistrationFilter!]
}

"""Filter criteria for querying events"""
input EventFilter {
  """Filter by event type (e.g., 'Transfer', 'NameRegistered', 'TextChanged')"""
  type: String

  """Filter by event type in list"""
  type_in: [String!]

  """Negated event-type match (subgraph parity)."""
  type_not: String

  """Negated event-type-in-list (subgraph parity)."""
  type_not_in: [String!]

  """Filter by domain name"""
  domain: String

  """Filter by contract address"""
  contractAddress: String

  """
  Address involvement (ensv2 extension): matches events where the address is the
  owner, sender (`from`), or recipient (`to`). Per-address history is
  `events(where:{involved:"0x…"}, orderBy: blockNumber, orderDirection: asc)`;
  per-name history is `events(where:{namehash:"0x…"})`.
  """
  involved: String

  """Filter by namehash"""
  namehash: String

  """Filter by block number greater than"""
  blockNumber_gt: Int

  """Filter by block number greater than or equal"""
  blockNumber_gte: Int

  """Filter by block number less than"""
  blockNumber_lt: Int

  """Filter by block number less than or equal"""
  blockNumber_lte: Int

  """Filter by timestamp greater than"""
  timestamp_gt: Int

  """Filter by timestamp greater than or equal"""
  timestamp_gte: Int

  """Filter by timestamp less than"""
  timestamp_lt: Int

  """Filter by timestamp less than or equal"""
  timestamp_lte: Int

  """Filter by protocol (v1 or v2)"""
  protocol: String

  """Boolean AND: every sub-filter must match. Each element is a full EventFilter, nested recursively (subgraph parity)."""
  and: [EventFilter!]

  """Boolean OR: any sub-filter matches. Each element is a full EventFilter, nested recursively; the OR group is AND-combined with sibling fields."""
  or: [EventFilter!]
}

"""EAC (Enhanced Access Control) role assignment"""
type EACRoleAssignment {
  """Assignment identifier"""
  id: String!

  """Resource (token ID) this role applies to"""
  resource: String!

  """Account that has the role"""
  account: String!

  """Role bitmap (hex string). Preserved verbatim for clients that decode it directly."""
  roleBitmap: String!

  """
  Human-readable names of the roles encoded in `roleBitmap`, decoded against the
  emitting contract's role table (resolver vs registry). Admin roles are suffixed
  with `_ADMIN` (e.g. `["SET_RESOLVER", "SET_RESOLVER_ADMIN"]`). Empty when no
  roles are set or the bitmap is unrecognized.
  """
  permissions: [String!]!

  """Block number when assigned"""
  blockNumber: Int!

  """Transaction hash"""
  transactionHash: String!

  """Timestamp when assigned"""
  timestamp: Int!

  """Domain name this role applies to (null for global roles)"""
  name: String
}

"""Detailed resolver information with statistics"""
type ResolverDetail {
  """Resolver contract address"""
  id: String!

  """Resolver contract address"""
  address: String!

  """Number of domains using this resolver"""
  nodeCount: Int!

  """Number of aliases defined on this resolver"""
  aliasCount: Int!

  """Number of distinct role holders on this resolver"""
  roleHolderCount: Int!

  """Domains using this resolver (limited)"""
  nodes(first: Int = 100): [Domain!]!

  """Aliases defined on this resolver"""
  aliases: [Alias!]!

  """EAC role assignments on this resolver"""
  roles: [EACRoleAssignment!]!

  """Events emitted by this resolver contract"""
  events(first: Int = 100): [Event!]!

  """Resource-name associations announced by this resolver (EAC resource naming; emitted on the first role grant per resource)"""
  namedResources: [NamedResourceEntry!]!
}

"""An EAC resource id and the name/record it guards on a resolver (from the Named*Resource discovery events)"""
type NamedResourceEntry {
  """Protocol the association was indexed under"""
  protocol: String!

  """EAC resource id (32-byte hex)"""
  resource: String!

  """Which record kind the resource guards: name | text | data | addr"""
  recordKind: String!

  """Text/data record key ('' for name/addr kinds)"""
  recordKey: String!

  """Coin type for addr-kind resources as a decimal string (ENSIP-11-safe; "-1" when not applicable)"""
  coinType: String!

  """The dotted name the resource is associated with"""
  name: String!

  """Block the association was announced at"""
  blockNumber: Int!
}

"""Registry information"""
type RegistryInfo {
  """Registry contract address"""
  address: String!

  """Name this registry manages"""
  name: String!

  """Namehash of the name"""
  namehash: String!

  """Parent registry address"""
  parentRegistry: String!

  """Block when registry was created"""
  createdBlock: Int!

  """Timestamp when registry was created"""
  createdAt: Int!

  """
  Registry admin (the account holding the full root-role bitmap on this
  contract, i.e. resource=0x0 / role_bitmap=0x111…111). Returns the most
  recently granted admin if multiple, or null if no root role has been
  granted yet.
  """
  owner: Account

  """Names whose `registry` is this contract — i.e. the labels minted in and managed by this registry (the reverse of a name's parent-registry lookup). Legacy offset-based pagination; prefer `labelConnection`."""
  labels(first: Int, skip: Int, where: DomainFilter, orderBy: Domain_orderBy, orderDirection: OrderDirection): [Domain!]!

  """Cursor-based version of `labels`: names whose `registry` is this contract (recommended)."""
  labelConnection(first: Int, after: String, last: Int, before: String, where: DomainFilter, orderBy: Domain_orderBy, orderDirection: OrderDirection): DomainConnection!

  """Total count of names whose `registry` is this contract."""
  labelCount: Int!

  """Names whose CURRENT subregistry pointer is this contract — i.e. the names that use this registry as their subname registry (the inverse of `Domain.subregistry`; the registry-UI "Referenced by" relation). Legacy offset-based pagination; prefer `referencedByConnection`."""
  referencedBy(first: Int, skip: Int, where: DomainFilter, orderBy: Domain_orderBy, orderDirection: OrderDirection): [Domain!]!

  """Cursor-based version of `referencedBy`: names whose subregistry pointer is this contract (recommended)."""
  referencedByConnection(first: Int, after: String, last: Int, before: String, where: DomainFilter, orderBy: Domain_orderBy, orderDirection: OrderDirection): DomainConnection!

  """Total count of names whose subregistry pointer is this contract."""
  referencedByCount: Int!

  """Events emitted by this registry contract (legacy offset-based)."""
  events(first: Int, skip: Int, where: EventFilter): [Event!]!

  """Cursor-based events emitted by this registry contract (recommended)."""
  eventConnection(first: Int, after: String, last: Int, before: String, where: EventFilter, orderBy: Event_orderBy, orderDirection: OrderDirection): EventConnection!

  """Total event count emitted by this registry contract."""
  eventCount: Int!

  """EAC role assignments on this registry (legacy offset-based)."""
  roles(first: Int, skip: Int, account: String): [EACRoleAssignment!]!

  """Cursor-based EAC role assignments on this registry (recommended)."""
  roleConnection(first: Int, after: String, last: Int, before: String, account: String): EACRoleAssignmentConnection!

  """Total role-assignment count on this registry."""
  roleCount: Int!
}

"""ENSIP-16 resolver metadata (offchain data endpoint)"""
type ResolverMetadata {
  """Metadata identifier"""
  id: String!

  """Resolver contract address"""
  resolver: String!

  """GraphQL endpoint URL for offchain data"""
  graphqlUrl: String!

  """Block when metadata was set"""
  blockNumber: Int!

  """Transaction hash"""
  transactionHash: String!

  """Timestamp when metadata was set"""
  timestamp: Int!
}

"""ENSIP-16 resolver approval/delegation"""
type ResolverApproval {
  """Approval identifier"""
  id: String!

  """Resolver contract address"""
  resolver: String!

  """Namehash being delegated"""
  namehash: String!

  """Optional context for namespacing (typically owner address)"""
  context: String

  """Delegate address"""
  delegate: String!

  """Whether approved (true) or revoked (false)"""
  approved: Boolean!

  """Block when approval was set"""
  blockNumber: Int!

  """Transaction hash"""
  transactionHash: String!

  """Log index"""
  logIndex: Int!

  """Timestamp when approval was set"""
  timestamp: Int!
}

"""Order direction for sorting"""
enum OrderDirection {
  asc
  desc
}

"""ENSIP-3 forward-verification verdict for an account's `primaryName` (Task 05)."""
"""How settled a domain's current state is against chain finality (finality-tiered reads)."""
enum DomainFinality {
  """The last change is at/below the finalized head; it will not reorg."""
  FINALIZED
  """The last change is at/below the safe head but above finalized."""
  SAFE
  """The last change is in the unsafe zone above the safe head; it may still reorg."""
  HEAD
}

enum PrimaryNameVerification {
  """The name's resolver.addr(node) resolves back to this address."""
  VERIFIED
  """The name resolves forward to a DIFFERENT address."""
  MISMATCH
  """The claimed name is not ENSIP-15 normalized (e.g. confusable/spoofed); never verified."""
  INVALID_NAME
  """No forward evidence exists: no resolver, or an empty/zero address record."""
  NOT_FOUND
  """The on-chain read could not be completed (revert or RPC error)."""
  UNVERIFIED
}

"""Fields to order Domain results by"""
enum Domain_orderBy {
  id
  name
  createdAt
  expiryDate
  registrationDate
}

"""Fields to order Event results by"""
enum Event_orderBy {
  blockNumber
  timestamp
  name
}

"""Fields to order Registration results by"""
enum Registration_orderBy {
  id
  name
  registrationDate
  expiryDate
}
