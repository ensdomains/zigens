# Run the published image — no local toolchain or source build required.
#   ZIGENS_IMAGE=ghcr.io/mdtanrikulu/zigens:0.1.0 docker compose -f docker-compose.server.yml up -d
# Pin a version tag in production; :latest is the default for convenience only.
# The build-from-source deployments stay on docker-compose.yml / docker-compose.staging.yml.

services:
  indexer-v2:
    image: ${ZIGENS_IMAGE:-ghcr.io/mdtanrikulu/zigens:latest}
    container_name: ensv2-indexer-v2
    restart: unless-stopped
    command: ["/app/ensv2-indexer-v2"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ens-data:/app/data
      - webhook-data:/app/webhooks
    environment:
      - DATABASE_PATH=/app/data/ens.db
      # Postgres (e.g. Neon): set DATABASE_URL to a postgres:// string to switch off
      # SQLite. Compose only forwards variables a service lists here, so without
      # these two the container never sees them and silently falls back to SQLite.
      - DATABASE_BACKEND=${DATABASE_BACKEND:-}
      # Pooled or direct — both work. The driver sends each statement as one
      # Parse+Bind+Describe+Execute+Sync group, so nothing it creates outlives the group
      # and a transaction-mode pooler has no per-connection state to lose. MEASURED:
      # indexing the same block range direct and through PgDog 0.1.26 on stock settings
      # produced byte-identical data across all 51 tables (V1 mainnet 131,820 events;
      # V2 sepolia 26,856 events). Session state is still pooler-dependent (pgbouncer
      # drops a connection-scoped SET, PgDog virtualises it), so put a statement_timeout
      # on the role or in the pooler rather than relying on SET. INDEXER_DATABASE_URL
      # overrides DATABASE_URL here, and is only needed to give this service its own
      # credentials or endpoint — one shared DATABASE_URL is enough.
      - DATABASE_URL=${INDEXER_DATABASE_URL:-${DATABASE_URL:-}}
      - RAINBOW_PATH=/app/data/ens_rainbow.db
      - DOWNLOAD_RAINBOW=true
      - RPC_URL=${RPC_URL}
      - NETWORK=${NETWORK:-sepolia}
      - BATCH_SIZE=${BATCH_SIZE:-2000}
      - POLL_INTERVAL=12
      - RATE_LIMIT_PER_SECOND=25
      - STATUS_PORT=3001
      - WEBHOOKS_ENABLED=${WEBHOOKS_ENABLED:-false}
      - WEBHOOK_DB_PATH=/app/webhooks/webhooks.db
      - WEBHOOK_MAX_RETRIES=${WEBHOOK_MAX_RETRIES:-3}
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ens-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    image: ${ZIGENS_IMAGE:-ghcr.io/mdtanrikulu/zigens:latest}
    container_name: ensv2-api
    restart: unless-stopped
    command: ["/app/api-entrypoint.sh"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "5655:5655"
    volumes:
      - ens-data:/app/data:ro
      - webhook-data:/app/webhooks
    environment:
      - DATABASE_PATH=/app/data/ens.db
      # Postgres (e.g. Neon): set DATABASE_URL to a postgres:// string to switch off
      # SQLite. Compose only forwards variables a service lists here, so without
      # these two the container never sees them and silently falls back to SQLite.
      - DATABASE_BACKEND=${DATABASE_BACKEND:-}
      # Pooled or direct — same single message group as the writer above, so no
      # prepared statement or portal outlives it. MEASURED with this service's binary:
      # 3200 concurrent requests through PgDog 0.1.26 in transaction mode, stock
      # settings, 0 errors — where the previous split-round-trip driver failed 176 of
      # 320 with SQLSTATE 08P01/26000 (and silently wrong rows whenever two colliding
      # statements took the same parameter count). API_DATABASE_URL overrides
      # DATABASE_URL here, and is only needed for separate credentials (e.g. the
      # read-only role in .env.example), not for correctness.
      - DATABASE_URL=${API_DATABASE_URL:-${DATABASE_URL:-}}
      - RAINBOW_PATH=/app/data/ens_rainbow.db
      - DOWNLOAD_RAINBOW=false
      - API_PORT=5655
      - GRAPHQL_MAX_DEPTH=10
      - GRAPHQL_MAX_COST=${GRAPHQL_MAX_COST:-10000}
      # While an EMPTY database runs its first bulk sync, /graphql answers 503
      # rather than serving a half-built index; an already-indexed database is
      # never gated. Set false to serve regardless.
      - GRAPHQL_SYNC_GATE_ENABLED=${GRAPHQL_SYNC_GATE_ENABLED:-true}
      # Without finality data, report stale=true once a protocol has gone this long
      # without committing a batch (see .env.example). Above the longest healthy
      # batch; set 0 for a --backfill or an END_BLOCK-pinned deployment.
      - COVERAGE_STALE_AFTER_SECONDS=${COVERAGE_STALE_AFTER_SECONDS:-3600}
      - WEBHOOKS_ENABLED=${WEBHOOKS_ENABLED:-false}
      - WEBHOOK_DB_PATH=/app/webhooks/webhooks.db
      - WEBHOOK_ADMIN_USERNAME=${WEBHOOK_ADMIN_USERNAME:-}
      - WEBHOOK_ADMIN_PASSWORD=${WEBHOOK_ADMIN_PASSWORD:-}
      - METRICS_ENABLED=false
    depends_on:
      - indexer-v2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5655/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ens-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ens-network:
    driver: bridge

volumes:
  ens-data:
    driver: local
  webhook-data:
    driver: local
